  /api/loan-requests/{loan_request_id}/data-connections/:
    get:
      description: 'The data connection object represents the state of a data connection in

        a third-party system, which has been initiated by sending the loan request

        information from Oper to the third-party system. Such an object is

        initially created by Oper, for example when the loan request is sent to

        a lender, at the user''s request. As soon as the user triggers the event,

        a new process is started with its own data connection object.


        Through this route, a third party system can view a specific loan request

        data connection object and all its related items but also update

        the status and (optionally) provide a set of messages to the sender of

        the loan request through that specific loan request data connection object.'
      operationId: api_loan_requests_data_connections_list
      parameters:
      - in: query
        name: integrator_type
        schema:
          type: string
      - in: path
        name: loan_request_id
        required: true
        schema:
          pattern: ^\d+$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LoanRequestDataConnection'
                type: array
          description: ''
      security:
      - jwtAuth: []
      tags:
      - Loan Requests
