openapi: 3.2.0
info:
  title: Oper Credits Privacy Policy API
  version: ''
tags:
- name: Privacy Policy
paths:
  /api/privacy-policy/:
    get:
      operationId: api_privacy_policy_retrieve
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyPolicy'
          description: ''
      security:
      - jwtAuth: []
      tags:
      - Privacy Policy
      summary: Api privacy policy retrieve
      x-summary-source: derived
components:
  schemas:
    Language:
      description: Can be managed at /resources/language
      properties:
        definition:
          type: string
        id:
          type: integer
        order:
          readOnly: true
          type: integer
      required:
      - definition
      - id
      - order
      type: object
    PrivacyPolicy:
      properties:
        configuration_id:
          format: uuid
          type: string
        content:
          type: string
        language:
          $ref: '#/components/schemas/Language'
        tenant:
          type:
          - integer
          - 'null'
        title:
          maxLength: 128
          type: string
      required:
      - content
      - language
      - title
      type: object
  securitySchemes:
    jwtAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
