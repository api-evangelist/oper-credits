      description: "Serializer to handle multiple subclasses of another class\n\n- The parent class needs to set the name of the field in 'shape_field' in Meta (e.g. liability_type)\n- The parent class needs to set the serializer of the type class in `shape_serializer` (e.g. LiabilityTypeSerializer)\n- The implementer needs to set serializer_map field on Meta\n- If the implementation is done in multiple module, set the multi_module flag on Meta on True\n    For example, subclasses of comments exist in multiple subclasses\n    so you also need to specify the module (e.g. clientmodule.ClientCommentSerializer)\n- The base model class must have an Inheritance Manager from django model utils as default manager\n- !! You can ONLY use enums as type fields for this polymorphism !!\n- Optionally you can define a default serializer to fall back to\n\nRules for serializer_map:\n* Single module\n    * You can either set the name as value or the serializer class itself\n        For classes, it must inherit from serializers.Serializer\n        For strings, e.g. EmploymentIncomeSerializer. They must be part of the same module\n            as the base serializer\n* Multi modules\n    * You can only set string values as values, and the module must be included\n        e.g. clientmodule.serializers.EmploymentIncomeSerializer"
      properties:
        comment_target:
          nullable: true
          type: integer
        comment_type:
          type: integer
        content:
          type: string
        created:
          format: date-time
          readOnly: true
          title: Creation date and time
          type: string
        id:
          readOnly: true
          type: integer
        last_modified:
          format: date-time
          readOnly: true
          title: Modification date and time
          type: string
        loan_request:
