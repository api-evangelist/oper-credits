components:
  schemas:
    Funder:
      properties:
        id:
          readOnly: true
          type: integer
        name:
          maxLength: 256
          type: string
      required:
      - id
      - name
      type: object
    LoanRequestSubPurpose:
      description: Can be managed at /resources/loan-request-sub-purpose
      properties:
        definition:
          type: string
        id:
          type: integer
        is_mortgage:
          type: boolean
        is_refinance:
          nullable: true
          type: boolean
        order:
          readOnly: true
          type: integer
      required:
      - definition
      - id
      - order
      type: object
    MortgageSimulatorRenovationCost:
      properties:
        amount:
          format: double
          minimum: 0
          type: number
        id:
          nullable: true
          type: integer
        is_green_renovations:
          nullable: true
          type: boolean
        type:
          $ref: '#/components/schemas/RenovationType'
      required:
      - amount
      - type
      type: object
    PaginatedReducedMortgageSimulationResultList:
      properties:
        count:
          example: 123
          type: integer
        next:
          example: http://api.example.org/accounts/?page=4
          format: uri
          nullable: true
          type: string
        previous:
          example: http://api.example.org/accounts/?page=2
          format: uri
          nullable: true
          type: string
        results:
          items:
            $ref: '#/components/schemas/ReducedMortgageSimulationResult'
          type: array
      required:
      - count
      - results
      type: object
    PurchaseSaleType:
      description: Can be managed at /resources/purchase-sale-type
      properties:
        definition:
          type: string
        id:
          type: integer
        order:
          readOnly: true
          type: integer
      required:
      - definition
      - id
      - order
      type: object
    MortgageSimulatorBorrowerInfo:
      properties:
        birth_date:
          format: date
          nullable: true
          type: string
        emails:
          items:
            $ref: '#/components/schemas/Email'
          nullable: true
          type: array
        first_name:
          nullable: true
          type: string
        has_vehicle:
          default: true
          nullable: true
          type: boolean
        id:
          nullable: true
          type: integer
        incomes:
          items:
            $ref: '#/components/schemas/MortgageSimulatorIncome'
          type: array
        is_living_in_same_household:
          default: false
          nullable: true
          type: boolean
        is_main_borrower:
          nullable: true
          type: boolean
        language:
          allOf:
          - $ref: '#/components/schemas/Language'
          nullable: true
        last_name:
          nullable: true
          type: string
        liabilities:
          items:
            $ref: '#/components/schemas/MortgageSimulatorLiability'
          type: array
        number_of_dependents:
          nullable: true
          type: integer
        people_in_household:
          nullable: true
          type: integer
        phone_numbers:
          items:
            $ref: '#/components/schemas/Phone'
          nullable: true
          type: array
      type: object
    MortgageSimulatorCollateral:
      properties:
        collateral_amount:
          format: double
          nullable: true
          type: number
        collateral_purpose:
          allOf:
          - $ref: '#/components/schemas/RealtyPurpose'
          nullable: true
        credit_provider:
          allOf:
          - $ref: '#/components/schemas/ReducedCreditProvider'
          nullable: true
        has_existing_loan:
          default: false
          type: boolean
        mortgage_inscription_start_date:
          format: date
          nullable: true
          type: string
        mortgage_security_type:
          allOf:
          - $ref: '#/components/schemas/MortgageSecurityType'
          nullable: true
        original_loan_amount:
          format: double
          nullable: true
          type: number
        realty_type:
          allOf:
          - $ref: '#/components/schemas/RealtyType'
          nullable: true
        realty_usage_type:
          allOf:
          - $ref: '#/components/schemas/RealtyUsageType'
          nullable: true
      type: object
    Phone:
      properties:
        country_code:
          $ref: '#/components/schemas/PhoneCountryCode'
        id:
          readOnly: true
          type: integer
        value:
          maxLength: 32
          type: string
      required:
      - country_code
      - id
      - value
      type: object
    CoLivingGroupType:
      description: Can be managed at /resources/co-living-group-type
      properties:
        definition:
          type: string
        id:
          type: integer
        order:
          readOnly: true
          type: integer
      required:
      - definition
      - id
      - order
      type: object
    ConvertSimulationToLoanRequest:
      properties:
        additional_needs:
          items:
            $ref: '#/components/schemas/MortgageSimulationAdditionalFinancingNeeds'
          nullable: true
          type: array
        akr_expenses:
          nullable: true
        analyst:
          allOf:
          - $ref: '#/components/schemas/ReducedBaseUser'
          nullable: true
        architect_fees:
          format: double
          nullable: true
          type: number
        borrowers_info:
          items:
            $ref: '#/components/schemas/MortgageSimulatorBorrowerInfo'
          type: array
        broker:
          allOf:
          - $ref: '#/components/schemas/ReducedBroker'
          nullable: true
        building_costs:
          format: double
          nullable: true
          type: number
        buy_out_amount:
          format: double
          nullable: true
          type: number
        calculated_financial_plan:
          allOf:
          - $ref: '#/components/schemas/MortgageSimulationFinancialPlan'
          nullable: true
        co_living_group_type:
          allOf:
          - $ref: '#/components/schemas/CoLivingGroupType'
          nullable: true
        collaterals:
          items:
            $ref: '#/components/schemas/MortgageSimulatorCollateral'
          nullable: true
          type: array
        created_by:
          allOf:
          - $ref: '#/components/schemas/ReducedBaseUser'
          readOnly: true
        dscr:
          nullable: true
        dsti:
          format: double
          nullable: true
          type: number
        epc_after_renovations:
          minimum: 0
          nullable: true
          type: integer
        epc_before_renovations:
          minimum: 0
          nullable: true
          type: integer
        external_calculators:
          nullable: true
        fair_market_value:
          format: double
          nullable: true
          type: number
        fiduciary:
          allOf:
          - $ref: '#/components/schemas/Fiduciary'
          nullable: true
        financial_assets:
          items:
            $ref: '#/components/schemas/MortgageSimulatorFinancialAsset'
          nullable: true
          type: array
        financial_plan:
          allOf:
          - $ref: '#/components/schemas/MortgageSimulationFinancialPlan'
          nullable: true
        financial_plan_loan_amount_items:
          description: Financial plan items funded by loans
          items:
            $ref: '#/components/schemas/MortgageSimulatorFinancialPlanLoanAmountItem'
          type: array
        financial_plan_overridden_fields:
          allOf:
          - $ref: '#/components/schemas/MortgageSimulationFinancialPlan'
          nullable: true
        financial_plan_own_fund_items:
          description: Financial plan items funded by own funds
          items:
            $ref: '#/components/schemas/MortgageSimulatorFinancialPlanOwnFundItem'
          type: array
        free_use_mortgage:
          format: double
          nullable: true
          type: number
        id:
          type: integer
        internal_reference:
          readOnly: true
          type: string
        is_main_first_residence:
          default: false
          type: boolean
        is_realtor_excluded:
          default: false
          type: boolean
        is_shared_with_borrower:
          default: false
          type: boolean
        land_purchase_type:
          allOf:
          - $ref: '#/components/schemas/LandPurchaseType'
          nullable: true
        land_value:
          format: double
          nullable: true
          type: number
        lead_generator:
          allOf:
          - $ref: '#/components/schemas/ReducedLeadGenerator'
          nullable: true
        loan_purposes:
          items:
            $ref: '#/components/schemas/LoanRequestPurpose'
          type: array
        ltv:
          format: double
          nullable: true
          type: number
        main_borrower:
          allOf:
          - $ref: '#/components/schemas/NestedClientProfile'
          readOnly: true
        monthly_payment_estimations:
          items:
            $ref: '#/components/schemas/MortgageSimulatorMonthlyPaymentEstimation'
          nullable: true
          type: array
        name:
          nullable: true
          type: string
        notary:
          allOf:
          - $ref: '#/components/schemas/Notary'
          nullable: true
        offers:
          items:
            $ref: '#/components/schemas/AdvisorMortgageSimulatorConvertOffer'
          nullable: true
          type: array
        price_of_land:
          format: double
          nullable: true
          type: number
        pro_fisco_value:
          format: double
          nullable: true
          type: number
        products_search_filters:
          allOf:
          - $ref: '#/components/schemas/MortgageSimulatorProductsSearchFilters'
          nullable: true
        purchase_sale_type:
          allOf:
          - $ref: '#/components/schemas/PurchaseSaleType'
          nullable: true
        realty_price:
          format: double
          nullable: true
          type: number
        realty_type:
          allOf:
          - $ref: '#/components/schemas/RealtyType'
          nullable: true
        realty_usage_type:
          allOf:
          - $ref: '#/components/schemas/RealtyUsageType'
          nullable: true
        refinances:
          items:
            $ref: '#/components/schemas/MortgageSimulatorRefinance'
          nullable: true
          type: array
        region:
          allOf:
          - $ref: '#/components/schemas/Region'
          nullable: true
        renovation_costs:
          items:
            $ref: '#/components/schemas/MortgageSimulatorRenovationCost'
          nullable: true
          type: array
        selected_discounts:
          nullable: true
        selected_document_types:
          items:
            type: integer
          nullable: true
          type: array
