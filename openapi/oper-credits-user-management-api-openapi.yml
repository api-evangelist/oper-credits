components:
  schemas:
    ApplicationUser:
      properties:
        email:
          type: string
        id:
          readOnly: true
          type: integer
        is_staff:
          type: boolean
          writeOnly: true
        is_superuser:
          type: boolean
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - id
      - is_staff
      - is_superuser
      - password
      type: object
    PatchedApplicationUser:
      properties:
        email:
          type: string
        id:
          readOnly: true
          type: integer
        is_staff:
          type: boolean
          writeOnly: true
        is_superuser:
          type: boolean
          writeOnly: true
        password:
          type: string
          writeOnly: true
      type: object
  securitySchemes:
    jwtAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
