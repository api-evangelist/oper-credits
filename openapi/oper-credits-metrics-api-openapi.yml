openapi: 3.2.0
info:
  title: Oper Credits Agent Documents Metrics API
  version: '1.0'
servers:
- url: https://developers.opercredits.com/
  description: Base URL declared by the provider in apis.yml (roadmap#122).
tags:
- name: Metrics
paths:
  /metrics/certs-expiration:
    get:
      operationId: metrics_certs_expiration_retrieve
      responses:
        '200':
          description: No response body
      security:
      - jwtAuth: []
      tags:
      - Metrics
components:
  securitySchemes:
    jwtAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
