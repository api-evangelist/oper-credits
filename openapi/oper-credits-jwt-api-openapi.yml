openapi: 3.2.0
info:
  title: Oper Credits JWT API
  version: ''
tags:
- name: JWT
paths:
  /api/jwt/:
    post:
      description: 'Takes a set of user credentials and returns an access and refresh JSON web

        token pair to prove the authentication of those credentials.'
      operationId: api_jwt_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoleTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoleTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleTokenObtainPair'
          description: ''
      security:
      - {}
      tags:
      - JWT
      summary: Api jwt create
      x-summary-source: derived
  /api/jwt/refresh/:
    post:
      description: 'Takes a refresh type JSON web token and returns an access type JSON web

        token if the refresh token is valid.'
      operationId: api_jwt_refresh_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
      security:
      - {}
      tags:
      - JWT
      summary: Api jwt refresh create
      x-summary-source: derived
components:
  schemas:
    RoleTokenObtainPair:
      properties:
        access:
          readOnly: true
          type: string
        password:
          type: string
          writeOnly: true
        refresh:
          readOnly: true
          type: string
        username:
          type: string
          writeOnly: true
      required:
      - access
      - password
      - refresh
      - username
      type: object
    TokenRefresh:
      properties:
        access:
          readOnly: true
          type: string
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
      type: object
  securitySchemes:
    jwtAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
