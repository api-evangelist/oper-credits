components:
  schemas:
    ProofInstance:
      properties:
        document_types:
          items:
            $ref: '#/components/schemas/DocumentType'
          type: array
        id:
          readOnly: true
          type: integer
        is_proof_to_sign:
          type: boolean
        loan_request:
          allOf:
          - $ref: '#/components/schemas/ReducedLoanRequest'
          writeOnly: true
        name:
          maxLength: 128
          type: string
        obsolete:
          type: boolean
        oper_reference:
          format: uuid
          type: string
        proof_requirement:
          $ref: '#/components/schemas/ReducedProofRequirement'
        status:
          $ref: '#/components/schemas/ProofStatus'
        uploader:
          $ref: '#/components/schemas/UserRole'
      required:
      - id
      - loan_request
      - name
      type: object
    ReducedFinancedItemCreditToTakeoverTyped:
      allOf:
      - properties:
          instance_type:
            type: string
        required:
