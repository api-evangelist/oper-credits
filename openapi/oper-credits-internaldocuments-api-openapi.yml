openapi: 3.2.0
info:
  title: Oper Credits Internaldocuments API
  version: ''
tags:
- name: Internaldocuments
paths:
  /api/internaldocuments/documents/:
    get:
      operationId: api_internaldocuments_documents_list
      parameters:
      - description: A page number within the paginated result set.
        in: query
        name: page
        required: false
        schema:
          type: integer
      - description: Number of results to return per page.
        in: query
        name: page_size
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocumentListDownloadList'
          description: ''
      security:
      - jwtAuth: []
      tags:
      - Internaldocuments
      summary: Api internaldocuments documents list
      x-summary-source: derived
  /api/internaldocuments/documents/{configuration_id}/:
    get:
      operationId: api_internaldocuments_documents_retrieve
      parameters:
      - in: path
        name: configuration_id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDownload'
          description: ''
      security:
      - jwtAuth: []
      tags:
      - Internaldocuments
      summary: Api internaldocuments documents retrieve
      x-summary-source: derived
  /api/internaldocuments/upload/:
    post:
      description: Override to add query params to the data, serialize the full payload and return an empty response
      operationId: api_internaldocuments_upload_create
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUpload'
          description: ''
      security:
      - jwtAuth: []
      tags:
      - Internaldocuments
      summary: Api internaldocuments upload create
      x-summary-source: derived
