openapi: 3.2.0
info:
  title: Oper Credits Agent Documents Gdpr Policy API
  version: '1.0'
servers:
- url: https://developers.opercredits.com/
  description: Base URL declared by the provider in apis.yml (roadmap#122).
tags:
- name: Gdpr Policy
paths:
  /api/gdpr-policy/:
    get:
      operationId: api_gdpr_policy_retrieve
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GdprPolicy'
          description: ''
      security:
      - jwtAuth: []
      tags:
      - Gdpr Policy
components:
  schemas:
    Language:
      description: Can be managed at /resources/language
      properties:
        definition:
          type: string
        id:
          type: integer
        order:
          readOnly: true
          type: integer
      required:
      - definition
      - id
      - order
      type: object
    GdprPolicy:
      properties:
        configuration_id:
          format: uuid
          type: string
        content:
          type: string
        language:
          $ref: '#/components/schemas/Language'
        title:
          maxLength: 128
          type: string
      required:
      - content
      - language
      - title
      type: object
  securitySchemes:
    jwtAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
