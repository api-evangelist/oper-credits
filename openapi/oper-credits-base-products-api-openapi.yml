components:
  schemas:
    ProductWhitelistedBrokerBulkImport:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BulkProduct2BrokerWhitelist'
          maxItems: 100000
          minItems: 1
          type: array
      required:
      - items
      type: object
    Funder:
      properties:
        id:
          readOnly: true
          type: integer
        name:
          maxLength: 256
          type: string
      required:
      - id
      - name
      type: object
    BaseRate:
      properties:
        id:
          readOnly: true
          type: integer
        percentage:
          readOnly: true
          type: string
        pricing_sheet:
          $ref: '#/components/schemas/ReducedPricingSheet'
        rate:
          format: double
          type: number
        variability:
          $ref: '#/components/schemas/Variability'
      required:
      - id
      - percentage
      - pricing_sheet
      - rate
      - variability
      type: object
    BaseProduct:
      properties:
        active:
          type: boolean
        credit_provider:
          allOf:
          - $ref: '#/components/schemas/ReducedCreditProvider'
          readOnly: true
        custom_translations:
          nullable: true
        funder:
          allOf:
          - $ref: '#/components/schemas/Funder'
          readOnly: true
        has_funder_specific_pricer:
          type: boolean
        id:
          readOnly: true
          type: integer
        is_simulator_reference_product:
          type: boolean
        loan_type:
          allOf:
          - $ref: '#/components/schemas/LoanType'
          readOnly: true
        logo_url:
          format: uri
          type: string
        name:
          maxLength: 64
          type: string
      required:
      - credit_provider
      - funder
      - id
      - loan_type
      - logo_url
      - name
      type: object
    Variability:
      description: Can be managed at /resources/variability
      properties:
        definition:
          type: string
        group_type:
          nullable: true
          type: integer
        id:
          type: integer
        order:
          readOnly: true
          type: integer
      required:
      - definition
      - id
      - order
      type: object
    ReducedCreditProvider:
      description: To be used for a short summary of the CreditProvider
      properties:
        active:
          readOnly: true
          type: boolean
        fsma_reference:
          maxLength: 128
          readOnly: true
          type: string
        full_name:
          readOnly: true
          type: string
        id:
          type: integer
        is_liability_provider:
          readOnly: true
          type: boolean
        loan_request_form_documents:
          readOnly: true
          type: string
        logo_url:
          format: uri
          readOnly: true
          type: string
        name:
          readOnly: true
          type: string
        order:
          maximum: 2147483647
          minimum: 0
          nullable: true
          readOnly: true
          type: integer
      required:
      - active
      - fsma_reference
      - full_name
      - id
      - is_liability_provider
      - loan_request_form_documents
      - logo_url
      - name
      - order
      type: object
    ReducedPricingSheet:
      description: "Baseclass for Reduced serializers.\n\nWill validate whether the objects exists, and returns the instance in to_internal_value\nSubclasses must implement Meta with at least the model and field attributes\n\nRaises\n------\n    Validations errors if the object doesn't exist\n    OperBadConfigurationException if the model isn't set"
      properties:
        id:
          type: integer
      required:
      - id
      type: object
    PricingSheet:
      properties:
        base_rates:
          items:
            $ref: '#/components/schemas/NestedBaseRate'
          type: array
        created:
          format: date-time
          nullable: true
          readOnly: true
          title: Creation date and time
          type: string
        id:
          readOnly: true
          type: integer
        is_active:
          readOnly: true
          type: string
        last_modified:
          format: date-time
          nullable: true
          readOnly: true
          title: Modification date and time
          type: string
        pricing_configuration: {}
        product:
          $ref: '#/components/schemas/MinimalBaseProduct'
        valid_from:
          format: date
          type: string
        version:
          maxLength: 32
          type: string
      required:
      - base_rates
      - created
      - id
      - is_active
      - last_modified
      - product
      - valid_from
      - version
      type: object
    MinimalBaseProduct:
      description: "Baseclass for Reduced serializers.\n\nWill validate whether the objects exists, and returns the instance in to_internal_value\nSubclasses must implement Meta with at least the model and field attributes\n\nRaises\n------\n    Validations errors if the object doesn't exist\n    OperBadConfigurationException if the model isn't set"
      properties:
        id:
          type: integer
      required:
      - id
      type: object
    PatchedBaseRate:
      properties:
        id:
          readOnly: true
          type: integer
        percentage:
          readOnly: true
          type: string
        pricing_sheet:
          $ref: '#/components/schemas/ReducedPricingSheet'
        rate:
          format: double
          type: number
        variability:
          $ref: '#/components/schemas/Variability'
      type: object
    PatchedAllowedProductVariability:
      properties:
        active:
          type: boolean
        default_duration:
          maximum: 999
          minimum: 1
          type: integer
        id:
          readOnly: true
          type: integer
        is_simulator_reference_variability:
          type: boolean
        max_duration:
          maximum: 999
          minimum: 1
          type: integer
        min_duration:
          maximum: 999
          minimum: 1
          type: integer
        variability:
          $ref: '#/components/schemas/Variability'
      type: object
    PricingSheetDiscount:
      properties:
        discounts:
          items:
            $ref: '#/components/schemas/AdminDiscount'
          type: array
      required:
      - discounts
      type: object
    Explanation:
      properties:
        explanation:
          type: string
        language:
          $ref: '#/components/schemas/Language'
      required:
      - explanation
      - language
      type: object
    PatchedBaseProduct:
      properties:
        active:
          type: boolean
        credit_provider:
          allOf:
          - $ref: '#/components/schemas/ReducedCreditProvider'
          readOnly: true
        custom_translations:
          nullable: true
        funder:
          allOf:
          - $ref: '#/components/schemas/Funder'
          readOnly: true
        has_funder_specific_pricer:
          type: boolean
        id:
          readOnly: true
          type: integer
        is_simulator_reference_product:
          type: boolean
        loan_type:
