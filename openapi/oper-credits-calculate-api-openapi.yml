paths:
  /api/calculate/baby-loan/:
    post:
      operationId: api_calculate_baby_loan_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateBabyLoan'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CalculateBabyLoan'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CalculateBabyLoan'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateBabyLoan'
          description: ''
      security:
      - jwtAuth: []
      tags:
      - Calculate
  /api/calculate/credit-theoretical-amortization/:
