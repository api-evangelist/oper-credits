openapi: 3.0.3
info:
  title: Oper Credits Agent Documents Clients API
  version: ''
tags:
- name: Clients
paths:
  /api/clients/:
    get:
      description: 'Mixin that routes to the loan request and verifies if the requestor has access to the requested resource

        To use the Role View Mixin, you must define either queryset or overwrite get_base_queryset'
      operationId: api_clients_list
      parameters:
      - description: A page number within the paginated result set.
        in: query
        name: page
        required: false
        schema:
          type: integer
      - description: Number of results to return per page.
        in: query
        name: page_size
        required: false
        schema:
          type: integer
      - description: A search term.
        in: query
        name: search
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNestedClientProfileList'
          description: ''
      security:
      - jwtAuth: []
      tags:
      - Clients
    post:
      description: 'Mixin that routes to the loan request and verifies if the requestor has access to the requested resource

        To use the Role View Mixin, you must define either queryset or overwrite get_base_queryset'
      operationId: api_clients_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRegistryProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientRegistryProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClientRegistryProfile'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRegistryProfile'
          description: ''
      security:
      - jwtAuth: []
      tags:
      - Clients
  /api/clients/{id}/:
    delete:
      description: 'Mixin that routes to the loan request and verifies if the requestor has access to the requested resource

        To use the Role View Mixin, you must define either queryset or overwrite get_base_queryset'
      operationId: api_clients_destroy
      parameters:
      - description: A unique integer value identifying this Client Profile.
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: No response body
      security:
      - jwtAuth: []
      tags:
      - Clients
    get:
      description: 'Mixin that routes to the loan request and verifies if the requestor has access to the requested resource

        To use the Role View Mixin, you must define either queryset or overwrite get_base_queryset'
      operationId: api_clients_retrieve
      parameters:
      - description: A unique integer value identifying this Client Profile.
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRegistryProfile'
          description: ''
      security:
      - jwtAuth: []
      tags:
      - Clients
    patch:
      description: 'Mixin that routes to the loan request and verifies if the requestor has access to the requested resource

        To use the Role View Mixin, you must define either queryset or overwrite get_base_queryset'
      operationId: api_clients_partial_update
      parameters:
      - description: A unique integer value identifying this Client Profile.
        in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClientRegistryProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClientRegistryProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClientRegistryProfile'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRegistryProfile'
          description: ''
      security:
      - jwtAuth: []
      tags:
      - Clients
    put:
      description: 'Mixin that routes to the loan request and verifies if the requestor has access to the requested resource

        To use the Role View Mixin, you must define either queryset or overwrite get_base_queryset'
      operationId: api_clients_update
      parameters:
      - description: A unique integer value identifying this Client Profile.
        in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
