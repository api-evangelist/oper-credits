components:
  schemas:
    PatchedUserProfileAuto:
      properties:
        birth_city:
          maxLength: 128
          type: string
        birth_date:
          format: date
          nullable: true
          type: string
        first_name:
          maxLength: 64
          type: string
        id:
          readOnly: true
          type: integer
        last_name:
          maxLength: 128
          type: string
        middle_name:
          maxLength: 64
          type: string
        mother_maiden_name:
          maxLength: 128
          type: string
        oper_reference:
          format: uuid
          type: string
        title:
          nullable: true
          type: integer
        title2:
          nullable: true
          type: integer
        user:
          type: integer
      type: object
    PatchedUser2CreditProviderAuto:
      properties:
        bank_id:
          maxLength: 64
          type: string
        credit_provider:
          nullable: true
          type: integer
        id:
          readOnly: true
          type: integer
        user:
          type: integer
      type: object
    PermissionAuto:
      properties:
        codename:
          maxLength: 100
          type: string
        content_type:
          type: integer
        id:
          readOnly: true
          type: integer
        name:
          maxLength: 255
          type: string
      required:
      - codename
      - content_type
      - id
      - name
      type: object
    Profile2PhoneAuto:
      properties:
        id:
          readOnly: true
          type: integer
        is_secret:
          type: boolean
        phone_number:
          type: integer
        phone_type:
          type: integer
        profile:
          type: integer
      required:
      - id
      - phone_number
      - phone_type
      - profile
      type: object
    PatchedAddressAuto:
      properties:
        box:
          maxLength: 64
          type: string
        building:
          default: ''
          maxLength: 64
          type: string
        city:
          maxLength: 64
          type: string
        country:
          nullable: true
          type: integer
        floor:
          maxLength: 64
          type: string
        heading:
          exclusiveMaximum: true
          exclusiveMinimum: true
          format: double
          maximum: 100000
          minimum: -100000
          nullable: true
          type: number
        house_number:
          maxLength: 64
          type: string
        id:
          readOnly: true
