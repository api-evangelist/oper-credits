aid: oper-credits
name: Oper Credits
description: >-
  Oper Credits is a Belgian digital mortgage origination platform (Brussels, founded
  2019) that lets banks, lenders, insurers, and brokers offer and process end-to-end
  digital mortgages. Its white-labelled, multi-tenant Oper Connect platform exposes a
  JWT-authenticated REST API organized around the loan request as the central object,
  under which borrowers, properties, offers, documents, guarantees, and decisions are
  nested, plus a versioned loan-request webhook surface and an AI underwriting agent
  ("Herman") that automates document collection, extraction, verification, and
  policy analysis. The platform is ISO/IEC 27001 certified and GDPR compliant.
