openapi: 3.0.3
info:
  title: Oper Credits Agent Documents Loan Requests API
  version: "1.0"
tags:
- name: Loan Requests
paths:
  /api/loan-requests/:
    get:
      description: 'Loan requests filtered on the role and relation to the user

        via a ThirdParty or CreditProvider.'
      operationId: api_loan_requests_list
      parameters:
      - in: query
        name: analyst
        schema:
          type: integer
      - in: query
        name: analyst_or_owner
        schema:
          type: string
      - in: query
        name: anonymized
        schema:
          type: boolean
      - explode: true
        in: query
        name: broker
        schema:
          items:
            type: integer
          type: array
        style: form
      - in: query
        name: created_date_end
        schema:
          format: date
          type: string
      - in: query
        name: created_date_start
        schema:
          format: date
          type: string
      - in: query
        name: date_submission_end
        schema:
          format: date
          type: string
      - in: query
        name: date_submission_start
        schema:
          format: date
          type: string
      - in: query
        name: deed_date_end
        schema:
          format: date
          type: string
      - in: query
        name: deed_date_start
        schema:
          format: date
          type: string
      - in: query
        name: external_metadata
        schema: {}
      - in: query
        name: loan_request_type
        schema:
          type: string
      - in: query
        name: owner
        schema:
          type: integer
      - description: A page number within the paginated result set.
        in: query
        name: page
        required: false
        schema:
          type: integer
      - description: Number of results to return per page.
        in: query
        name: page_size
        required: false
        schema:
          type: integer
      - description: A search term.
        in: query
        name: search
        required: false
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLoanRequestList'
          description: ''
      security:
      - jwtAuth: []
      tags:
      - Loan Requests
    post:
      description: 'Loan requests filtered on the role and relation to the user

        via a ThirdParty or CreditProvider.'
      operationId: api_loan_requests_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoanRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoanRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanRequest'
          description: ''
      security:
      - jwtAuth: []
      tags:
      - Loan Requests
